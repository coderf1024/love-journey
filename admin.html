<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱空间管理</title>
    <link rel="stylesheet" href="css/style.css?v=20261022-5">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .login-card {
            background: linear-gradient(135deg, #fff 0%, #fff5f8 100%);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(255, 182, 193, 0.2);
            text-align: center;
            margin-top: 100px;
        }

        .login-title {
            font-size: 1.8rem;
            color: #ff69b4;
            margin-bottom: 30px;
        }

        .login-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ffe4ec;
            border-radius: 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .login-input:focus {
            border-color: #ff69b4;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
            border: none;
            border-radius: 15px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-title {
            font-size: 1.5rem;
            color: #ff69b4;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fff;
            border: 2px solid #ffe4ec;
            border-radius: 10px;
            color: #5a4a5a;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: #ff69b4;
            color: #ff69b4;
        }

        .issue-card {
            background: linear-gradient(135deg, #fff 0%, #fff5f8 100%);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
            margin-bottom: 30px;
        }

        .issue-title {
            font-size: 1.2rem;
            color: #5a4a5a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #5a4a5a;
            font-weight: 500;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffe4ec;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-select:focus, .form-input:focus {
            border-color: #ff69b4;
        }

        .issue-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
            border: none;
            border-radius: 15px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .issue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
        }

        .issue-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .stats-card {
            background: linear-gradient(135deg, #fff 0%, #fff5f8 100%);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
        }

        .stat-item {
            padding: 15px;
            background: rgba(255, 228, 236, 0.5);
            border-radius: 15px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #ff69b4;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #8a7a8a;
            margin-top: 5px;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .coupon-list {
            background: linear-gradient(135deg, #fff 0%, #fff5f8 100%);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
            margin-top: 30px;
        }

        .coupon-list-title {
            font-size: 1.2rem;
            color: #5a4a5a;
            margin-bottom: 20px;
        }

        .coupon-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 228, 236, 0.5);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .coupon-item:hover {
            background: rgba(255, 228, 236, 0.8);
            transform: translateX(5px);
        }

        .coupon-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .coupon-item-icon {
            font-size: 1.5rem;
        }

        .coupon-item-details {
            display: flex;
            flex-direction: column;
        }

        .coupon-item-title {
            font-weight: 600;
            color: #5a4a5a;
        }

        .coupon-item-meta {
            font-size: 0.85rem;
            color: #8a7a8a;
        }

        .coupon-item-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .coupon-item-status.available {
            background: #d4edda;
            color: #155724;
        }

        .coupon-item-status.used {
            background: #f8d7da;
            color: #721c24;
        }

        .delete-btn {
            padding: 8px 16px;
            background: #ff6b6b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .delete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .coupon-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empty-list {
            text-align: center;
            padding: 40px;
            color: #8a7a8a;
        }

        .admin-container {
            width: min(760px, calc(100% - 28px));
            max-width: none;
            padding: 36px 0 56px;
        }

        .login-card,
        .issue-card,
        .stats-card,
        .coupon-list {
            background: linear-gradient(135deg, rgba(255, 253, 246, 0.96), rgba(255, 248, 235, 0.9));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .login-card {
            margin-top: 14vh;
            padding: clamp(30px, 7vw, 46px);
        }

        .login-title,
        .admin-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--ink);
            font-family: var(--font-cute);
            font-weight: 400;
            letter-spacing: 0;
        }

        .login-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        .admin-title {
            font-size: clamp(1.55rem, 4vw, 2.3rem);
        }

        .admin-header {
            gap: 18px;
            margin-bottom: 24px;
        }

        .issue-title,
        .coupon-list-title {
            color: var(--ink);
            font-family: var(--font-cute);
            font-weight: 400;
        }

        .login-input,
        .form-select,
        .form-input {
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--ink);
            background: rgba(255, 253, 246, 0.92);
            font-family: var(--font-soft);
            font-size: 1.08rem;
        }

        .login-input:focus,
        .form-select:focus,
        .form-input:focus {
            border-color: var(--route);
            box-shadow: 0 0 0 4px rgba(43, 138, 166, 0.12);
        }

        .login-btn,
        .issue-btn,
        .logout-btn {
            border-radius: 999px;
            font-family: var(--font-soft);
            font-size: 1.08rem;
            font-weight: 800;
            transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .login-btn,
        .issue-btn {
            background: linear-gradient(135deg, var(--stamp), #f39caf);
            color: var(--paper-soft);
        }

        .login-btn:hover,
        .issue-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e96f8b, var(--route));
            box-shadow: none;
        }

        .logout-btn {
            color: var(--ink);
            background: rgba(255, 253, 246, 0.8);
            border: 1px solid var(--line);
        }

        .logout-btn:hover {
            color: var(--paper-soft);
            background: var(--ink);
            border-color: var(--ink);
        }

        .form-label,
        .coupon-item-title {
            color: var(--ink);
            font-family: var(--font-soft);
        }

        .stat-item,
        .coupon-item {
            background: rgba(251, 242, 223, 0.72);
            border: 1px solid rgba(38, 34, 58, 0.1);
            border-radius: 6px;
        }

        .stat-number {
            color: var(--stamp);
            font-family: var(--font-ui);
            font-weight: 800;
        }

        .stat-label,
        .coupon-item-meta,
        .empty-list {
            color: var(--muted);
            font-family: var(--font-soft);
        }

        .coupon-item:hover {
            background: rgba(255, 253, 246, 0.95);
            transform: translateX(4px);
        }

        .coupon-item-status.available {
            color: var(--route);
            background: rgba(91, 184, 182, 0.14);
        }

        .coupon-item-status.used {
            color: var(--stamp);
            background: rgba(239, 122, 149, 0.12);
        }

        .delete-btn {
            background: var(--stamp);
            border-radius: 999px;
            font-weight: 800;
        }

        .delete-btn:hover {
            background: var(--ink);
        }

        .message.success {
            color: #1f6b53;
            background: rgba(91, 184, 182, 0.14);
            border: 1px solid rgba(91, 184, 182, 0.26);
        }

        .message.error {
            color: var(--stamp);
            background: rgba(239, 122, 149, 0.12);
            border: 1px solid rgba(239, 122, 149, 0.26);
        }

        .title-flat-icon {
            position: relative;
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            background: rgba(248, 220, 136, 0.65);
            border-radius: 999px;
            vertical-align: middle;
        }

        .title-icon-lock::before {
            width: 18px;
            height: 14px;
            bottom: 7px;
            background: var(--route);
            border-radius: 4px;
        }

        .title-icon-lock::after {
            width: 15px;
            height: 13px;
            top: 7px;
            border: 4px solid var(--stamp);
            border-bottom: 0;
            border-radius: 999px 999px 0 0;
        }

        .title-icon-coupon::before {
            width: 22px;
            height: 16px;
            background: var(--lemon);
            border: 2px solid var(--stamp);
            border-radius: 5px;
        }

        .title-icon-coupon::after {
            width: 9px;
            height: 9px;
            background: var(--route);
            border-radius: 999px;
        }

        .coupon-item-icon.coupon-flat-icon {
            position: relative;
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            font-size: 0;
            background: linear-gradient(135deg, rgba(255, 215, 223, 0.5), rgba(248, 220, 136, 0.4));
            border: 1px solid rgba(239, 122, 149, 0.22);
            border-radius: 999px;
        }

        .coupon-item-icon.coupon-flat-icon::before {
            width: 22px;
            height: 16px;
        }

        .coupon-item-icon.coupon-flat-icon::after {
            width: 9px;
            height: 9px;
        }

        /* ---------- 小灶 / kitchen ---------- */

        .admin-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 22px;
            padding: 4px;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-radius: 999px;
        }

        .admin-tab {
            min-height: 42px;
            color: var(--muted);
            font-size: 0.9rem;
            border-radius: 999px;
        }

        .admin-tab.is-active {
            color: var(--paper-soft);
            background: var(--ink);
        }

        .admin-tab-panel[hidden] {
            display: none;
        }

        .kitchen-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .kitchen-stat {
            padding: 16px 10px;
            text-align: center;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
        }

        .kitchen-stat b {
            display: block;
            color: var(--stamp-deep);
            font-family: var(--font-ui);
            font-size: 1.5rem;
            font-variant-numeric: tabular-nums;
        }

        .kitchen-stat span {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .admin-card {
            margin-bottom: 18px;
            padding: 22px;
            background: linear-gradient(135deg, #fff 0%, #fff8f9 100%);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.12);
        }

        .admin-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .admin-card .issue-title {
            margin-bottom: 14px;
        }

        .admin-card-head .issue-title {
            margin-bottom: 0;
        }

        .admin-hint {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .admin-orders {
            display: grid;
            gap: 10px;
        }

        .admin-order {
            padding: 14px;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-left: 4px solid var(--line-strong);
            border-radius: 14px;
        }

        .admin-order.status-pending { border-left-color: var(--lemon); }
        .admin-order.status-accepted { border-left-color: #6aa6c8; }
        .admin-order.status-prepping { border-left-color: var(--route); }
        .admin-order.status-cooking { border-left-color: #e98b57; }
        .admin-order.status-served { border-left-color: var(--stamp); }
        .admin-order.status-completed,
        .admin-order.status-cancelled { opacity: 0.68; }

        .admin-order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .admin-order-top b {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
        }

        .admin-order-time {
            color: var(--muted);
            font-size: 0.7rem;
        }

        .admin-order-slot {
            margin-top: 6px;
            color: var(--stamp-deep);
            font-size: 0.72rem;
            font-weight: 600;
        }

        .admin-order-items {
            margin-top: 6px;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .admin-order-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.7rem;
        }

        .admin-order-note {
            margin-top: 8px;
            padding: 7px 10px;
            color: var(--ink-2);
            font-size: 0.76rem;
            background: rgba(43, 34, 49, 0.04);
            border-radius: 8px;
        }

        .admin-order-extra {
            margin-top: 6px;
            color: var(--stamp-deep);
            font-size: 0.7rem;
        }

        .admin-order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .admin-action {
            min-height: 38px;
            padding: 0 14px;
            color: var(--ink);
            font-size: 0.78rem;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-radius: 999px;
        }

        .admin-action.primary {
            color: var(--paper-soft);
            background: var(--ink);
            border-color: var(--ink);
        }

        .admin-action.danger {
            color: var(--stamp-deep);
        }

        .wallet-admin-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 14px;
        }

        .wallet-admin-row > div > span {
            display: block;
            color: var(--muted);
            font-size: 0.7rem;
        }

        .wallet-admin-row b {
            color: var(--stamp-deep);
            font-family: var(--font-ui);
            font-size: 1.6rem;
        }

        .wallet-admin-limit {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .wallet-admin-limit label {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .wallet-admin-limit input {
            width: 72px;
            padding: 8px 10px;
            color: var(--ink);
            font-size: 0.8rem;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .issue-btn.compact {
            padding: 12px;
            font-size: 0.9rem;
        }

        .admin-wallet-entries {
            margin-top: 14px;
        }

        .admin-dish-list {
            display: grid;
            gap: 8px;
        }

        .admin-dish {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .admin-dish-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            overflow: hidden;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 9px;
        }

        .admin-dish-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-dish-main {
            flex: 1;
            min-width: 0;
            display: grid;
            gap: 1px;
        }

        .admin-dish-main b {
            font-size: 0.85rem;
        }

        .admin-dish-main small {
            color: var(--muted);
            font-size: 0.68rem;
        }

        .admin-dish-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
        }

        .mini-btn {
            min-height: 30px;
            padding: 0 9px;
            color: var(--muted);
            font-size: 0.66rem;
            background: var(--paper-soft);
            border: 1px solid var(--line);
            border-radius: 999px;
        }

        .mini-btn.is-on {
            color: var(--route);
            background: rgba(47, 155, 152, 0.08);
            border-color: rgba(47, 155, 152, 0.3);
        }

        .mini-btn.danger {
            color: var(--stamp-deep);
        }

        .dish-form {
            display: grid;
            gap: 8px;
        }

        .dish-form-checks {
            display: flex;
            gap: 16px;
            color: var(--ink-2);
            font-size: 0.75rem;
        }

        .dish-form-checks label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-form-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-form-actions .issue-btn {
            flex: 1;
        }

        @media (max-width: 620px) {
            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .coupon-item,
            .coupon-item-actions {
                align-items: flex-start;
                flex-direction: column;
            }

            .delete-btn {
                margin-left: 0;
            }

            .kitchen-summary,
            .admin-form-grid {
                grid-template-columns: 1fr;
            }

            .kitchen-summary {
                grid-template-columns: repeat(3, 1fr);
            }

            .admin-dish {
                flex-wrap: wrap;
            }

            .admin-dish-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="login-card" id="login-card">
            <h1 class="login-title"><span class="title-flat-icon title-icon-lock" aria-hidden="true"></span>登录</h1>
            <input type="password" class="login-input" id="passcode-input" placeholder="请输入口令">
            <button class="login-btn" id="login-btn">进入</button>
            <p id="login-error" style="color: var(--stamp); margin-top: 15px; display: none;">口令错误，请重试</p>
        </div>

        <div class="admin-panel" id="admin-panel">
            <div class="admin-header">
                <h1 class="admin-title"><span class="title-flat-icon title-icon-coupon" aria-hidden="true"></span>恋爱空间管理</h1>
                <button class="logout-btn" id="logout-btn">退出</button>
            </div>

            <div class="message" id="message"></div>

            <div class="admin-tabs" role="tablist" aria-label="管理模块">
                <button class="admin-tab is-active" type="button" role="tab" aria-selected="true" data-admin-tab="coupons">恋爱卡</button>

            <div class="admin-tab-panel" id="tab-coupons">

            <div class="issue-card">
                <h2 class="issue-title">赠送恋爱卡</h2>
                <div class="form-group">
                    <label class="form-label">时长</label>
                    <select class="form-select" id="duration-select">
                        <option value="5">5 分钟</option>
                        <option value="10">10 分钟</option>

                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-input" id="title-input" placeholder="默认：按摩卡">
                </div>
                <button class="issue-btn" id="issue-btn">赠送</button>
            </div>

            <div class="stats-card">
                <h2 class="issue-title">统计数据</h2>
                <div class="stats-grid">
                    <div class="stat-item">

                        <div class="stat-label">总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="available-count">0</div>
                        <div class="stat-label">未使用</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="used-count">0</div>
                        <div class="stat-label">已使用</div>
                    </div>
                </div>
            </div>

            <div class="coupon-list">
                <h2 class="coupon-list-title">恋爱卡列表</h2>
                <div id="coupon-list-container">
                    <div class="empty-list">暂无恋爱卡</div>
                </div>
            </div>

            </div>

            <div class="admin-tab-panel" id="tab-kitchen" hidden>
                <div class="kitchen-summary">
                    <div class="kitchen-stat"><b id="admin-summary-balance">0</b><span>用户余额</span></div>
                    <div class="kitchen-stat"><b id="admin-active-orders">0</b><span>待接单</span></div>
                    <div class="kitchen-stat"><b id="admin-today-served">0</b><span>本周预约</span></div>
                </div>

                <section class="admin-card">
                    <div class="admin-card-head">
                        <h2 class="issue-title">厨房订单</h2>
                        <button class="mini-btn" type="button" id="admin-refresh-orders">刷新</button>
                    </div>
                    <div class="admin-orders" id="admin-orders">
                        <div class="empty-list">暂无订单</div>
                    </div>
                </section>

                <section class="admin-card">
                    <h2 class="issue-title">钱包</h2>
                    <div class="wallet-admin-row">
                        <div>
                            <span>当前余额</span>
                            <b id="admin-wallet-balance">0</b>

                            <label for="admin-overdraft">最多可欠</label>

                            <input class="form-input" id="dish-price" type="number" min="0" step="1" inputmode="numeric" placeholder="价格（币）" required>
                            <input class="form-input" id="dish-prep" type="number" min="1" step="1" inputmode="numeric" placeholder="预计分钟" required>
                            <input class="form-input" id="dish-icon" type="text" maxlength="4" placeholder="图标 emoji" value="🍽️">
                            <input class="form-input" id="dish-tags" type="text" placeholder="标签，逗号分隔">
                            <input class="form-input" id="dish-image" type="text" placeholder="图片 URL（可选，如 assets/media/dishes/...）">
                        </div>
                        <input class="form-input" id="dish-desc" type="text" placeholder="一句话描述">
                        <div class="dish-form-checks">
                            <label><input type="checkbox" id="dish-available" checked> 供应中</label>
                            <label><input type="checkbox" id="dish-special"> 今日推荐</label>
                        </div>
                        <div class="admin-form-actions">
                            <button class="issue-btn compact" type="submit" id="dish-submit">保存菜品</button>
                            <button class="mini-btn" type="button" id="dish-cancel" hidden>取消编辑</button>
                        </div>

    <div class="dialog" id="admin-confirm" aria-hidden="true">
        <div class="dialog-backdrop" data-admin-confirm="cancel"></div>
        <div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="admin-confirm-title">
            <h2 id="admin-confirm-title">确认</h2>
            <p id="admin-confirm-message"></p>
            <div class="dialog-actions">
                <button class="dialog-btn" type="button" id="admin-confirm-cancel" data-admin-confirm="cancel">取消</button>
                <button class="dialog-btn is-primary" type="button" id="admin-confirm-ok" data-admin-confirm="ok">确认</button>
            </div>
        </div>
    </div>

    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
    <script src="js/oss-config.js?v=20261022-5"></script>
    <script src="js/crypto-utils.js?v=20261022-5"></script>
    <script src="js/oss-utils.js?v=20261022-5"></script>
    <script src="js/store.js?v=20261022-5"></script>
    <script>
        let isLoggedIn = false;
        let adminData = null;
        let adminTab = 'coupons';
        let adminPollTimer = null;

        const ORDER_LABEL = {
            pending: '待接单',
            accepted: '已接单',
            prepping: '备菜中',
            cooking: '制作中',
            served: '已出餐',
            completed: '已完成',
            cancelled: '已取消'
        };

        const $ = id => document.getElementById(id);

        function esc(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toDate(value) {
            if (!value) return null;
            const text = String(value);
            const date = text.includes('T') ? new Date(text) : new Date(text.replace(/-/g, '/'));
            return isNaN(date.getTime()) ? null : date;
        }

        function formatDate(value, withTime = true) {
            const date = toDate(value);
            if (!date) return '';
            const pad = n => String(n).padStart(2, '0');
            const day = `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())}`;
            return withTime ? `${day} ${pad(date.getHours())}:${pad(date.getMinutes())}` : day;
        }

        function clock(value) {
            const date = toDate(value);
            if (!date) return '';
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function todayKey() {
            const date = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        }

        /* ---------- admin confirm dialog ---------- */

        let adminConfirmResolver = null;

        function adminConfirm({ title = '确认', message = '', okText = '确认', cancelText = '取消', danger = false } = {}) {
            return new Promise(resolve => {
                if (adminConfirmResolver) adminConfirmResolver(false);
                adminConfirmResolver = resolve;

                document.getElementById('admin-confirm-title').textContent = title;
                document.getElementById('admin-confirm-message').textContent = message;
                const ok = document.getElementById('admin-confirm-ok');
                const cancel = document.getElementById('admin-confirm-cancel');
                ok.textContent = okText;
                cancel.textContent = cancelText;
                ok.classList.toggle('is-danger', !!danger);

                const dialog = document.getElementById('admin-confirm');
                dialog.classList.add('is-open');
                dialog.setAttribute('aria-hidden', 'false');
                document.documentElement.classList.add('is-locked');
            });
        }

        function resolveAdminConfirm(value) {
            const dialog = document.getElementById('admin-confirm');
            dialog.classList.remove('is-open');
            dialog.setAttribute('aria-hidden', 'true');
            document.documentElement.classList.remove('is-locked');
            const resolve = adminConfirmResolver;
            adminConfirmResolver = null;
            if (resolve) resolve(!!value);
        }

        document.querySelectorAll('[data-admin-confirm]').forEach(element => {
            element.addEventListener('click', () => resolveAdminConfirm(element.dataset.adminConfirm === 'ok'));
        });

        document.addEventListener('keydown', event => {
            if (event.key !== 'Escape') return;
            const dialog = document.getElementById('admin-confirm');
            if (dialog.classList.contains('is-open')) resolveAdminConfirm(false);
        });

        /* ---------- boot / auth ---------- */

        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('passcode-input').addEventListener('keypress', event => {
            if (event.key === 'Enter') handleLogin();
        });
        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('issue-btn').addEventListener('click', handleIssue);

        document.querySelectorAll('[data-admin-tab]').forEach(button => {
            button.addEventListener('click', () => switchAdminTab(button.dataset.adminTab));
        });

        document.getElementById('admin-orders').addEventListener('click', handleOrderListClick);
        document.getElementById('admin-refresh-orders').addEventListener('click', refreshAdminOrders);
        document.getElementById('admin-grant-btn').addEventListener('click', handleGrant);
        document.getElementById('admin-save-overdraft').addEventListener('click', handleSaveOverdraft);
        document.getElementById('dish-form').addEventListener('submit', handleDishSubmit);
        document.getElementById('dish-cancel').addEventListener('click', resetDishForm);
        document.getElementById('admin-dish-list').addEventListener('click', handleDishListClick);

        async function handleLogin() {
            const passcode = document.getElementById('passcode-input').value;

            if (!verifyPasscode(passcode)) {
                document.getElementById('login-error').style.display = 'block';
                return;
            }

            isLoggedIn = true;
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('admin-panel').classList.add('active');
            document.getElementById('login-error').style.display = 'none';
            await loadAdmin();
            startAdminPolling();
        }

        function handleLogout() {
            isLoggedIn = false;
            stopAdminPolling();
            document.getElementById('passcode-input').value = '';
            document.getElementById('login-card').style.display = 'block';
            document.getElementById('admin-panel').classList.remove('active');
        }

        function startAdminPolling() {
            stopAdminPolling();
            adminPollTimer = setInterval(() => {
                if (isLoggedIn && adminTab === 'kitchen') refreshAdminOrders();
            }, 15000);
        }

        function stopAdminPolling() {
            if (adminPollTimer) {
                clearInterval(adminPollTimer);
                adminPollTimer = null;
            }
        }

        /* ---------- data ---------- */

        async function loadAdmin() {
            if (typeof loadAdminData !== 'function') {
                showMessage('页面脚本版本不一致，请强制刷新一下', 'error');
                return;
            }
            try {
                adminData = await loadAdminData();
                renderCoupons();
                renderSummary();
                renderOrders();
                renderWallet();
                renderMenuAdmin();
            } catch (error) {
                console.error(error);
                showMessage('加载失败: ' + error.message, 'error');
            }
        }

        async function refreshAdminOrders() {
            if (!isLoggedIn || document.visibilityState !== 'visible') return;
            try {
                const data = await refreshOrderData();
                if (!adminData) {
                    await loadAdmin();
                    return;
                }
                adminData.orders = data.orders;
                adminData.wallet = data.wallet;
                adminData.latestOrder = data.latestOrder;
                renderSummary();
                renderOrders();
                renderWallet();
            } catch (error) {
                console.warn('刷新订单失败:', error);
            }
        }

        function switchAdminTab(tab) {
            adminTab = tab;
            document.querySelectorAll('[data-admin-tab]').forEach(button => {
                const active = button.dataset.adminTab === tab;
                button.classList.toggle('is-active', active);
                button.setAttribute('aria-selected', String(active));
            });
            document.getElementById('tab-coupons').hidden = tab !== 'coupons';
            document.getElementById('tab-kitchen').hidden = tab !== 'kitchen';
            if (tab === 'kitchen') refreshAdminOrders();
        }

        /* ---------- coupons ---------- */

        function renderCoupons() {
            const coupons = (adminData.coupons || []).slice().sort((a, b) => Number(b.id) - Number(a.id));

            document.getElementById('total-count').textContent = coupons.length;
            document.getElementById('available-count').textContent = coupons.filter(c => c.status === 'available').length;
            document.getElementById('used-count').textContent = coupons.filter(c => c.status === 'used').length;

            const container = document.getElementById('coupon-list-container');
            if (!coupons.length) {
                container.innerHTML = '<div class="empty-list">暂无数据</div>';
                return;
            }

            container.innerHTML = coupons.map(coupon => `
                <div class="coupon-item" data-coupon-id="${coupon.id}">
                    <div class="coupon-item-info">
                        <span class="coupon-item-icon coupon-flat-icon" aria-hidden="true"></span>
                        <div class="coupon-item-details">
                            <span class="coupon-item-title">${esc(coupon.title)} #${coupon.id}</span>
                            <span class="coupon-item-meta">${esc(coupon.duration)}${esc(coupon.durationUnit)} · ${esc(coupon.acquiredDate)}</span>
                        </div>
                    </div>
                    <div class="coupon-item-actions">
                        <span class="coupon-item-status ${coupon.status}">${coupon.status === 'available' ? '未使用' : '已使用'}</span>
                        <button class="delete-btn" onclick="handleDelete(${coupon.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        async function handleDelete(couponId) {
            const ok = await adminConfirm({
                title: '删除这张恋爱卡？',
                message: `#${couponId} 会被永久删除。`,
                okText: '删除',
                danger: true
            });
            if (!ok) return;

            const button = document.querySelector(`[data-coupon-id="${couponId}"] .delete-btn`);
            if (button) {
                button.disabled = true;
                button.textContent = '删除中...';
            }

            try {
                await deleteCoupon(couponId);
                showMessage('删除成功', 'success');
                await loadAdmin();
            } catch (error) {
                showMessage('删除失败: ' + error.message, 'error');
                if (button) {
                    button.disabled = false;
                    button.textContent = '删除';
                }
            }
        }

        async function handleIssue() {
            const duration = parseInt(document.getElementById('duration-select').value, 10);
            const title = document.getElementById('title-input').value || '按摩卡';
            const button = document.getElementById('issue-btn');

            button.disabled = true;
            button.textContent = '赠送中...';

            try {
                await addCoupon({ icon: '💆', title, duration, durationUnit: '分钟' });
                showMessage(`${title}赠送成功！时长：${duration}分钟`, 'success');
                document.getElementById('title-input').value = '';
                await loadAdmin();
            } catch (error) {
                showMessage('赠送失败: ' + error.message, 'error');
            } finally {
                button.disabled = false;
                button.textContent = '赠送';
            }
        }

        /* ---------- kitchen: orders ---------- */

        function renderSummary() {
            if (!adminData) return;
            const wallet = adminData.wallet || { balance: 0 };
            const orders = adminData.orders || [];
            const pending = orders.filter(order => order.status === 'pending').length;
            const now = Date.now();
            const upcoming = orders.filter(order => !['completed', 'cancelled'].includes(order.status))
                .filter(order => {
                    const at = toDate(order.scheduledFor);
                    return at && at.getTime() >= now - 6 * 3600 * 1000 && at.getTime() <= now + 7 * 86400 * 1000;
                }).length;

            document.getElementById('admin-summary-balance').textContent = wallet.balance;
            document.getElementById('admin-active-orders').textContent = pending;
            document.getElementById('admin-today-served').textContent = upcoming;
        }

        function renderOrders() {
            if (!adminData) return;
            const container = document.getElementById('admin-orders');
            const orders = (adminData.orders || []).slice();
            if (!orders.length) {
                container.innerHTML = '<div class="empty-list">还没有订单</div>';
                return;
            }

            const rank = { pending: 0, accepted: 1, prepping: 2, cooking: 3, served: 4, completed: 5, cancelled: 6 };
            const activeStatuses = new Set(['pending', 'accepted', 'prepping', 'cooking', 'served']);
            orders.sort((a, b) => {
                const ar = rank[a.status] == null ? 9 : rank[a.status];
                const br = rank[b.status] == null ? 9 : rank[b.status];
                if (ar !== br) return ar - br;
                const as = String(a.scheduledFor || a.placedAt || '');
                const bs = String(b.scheduledFor || b.placedAt || '');
                return activeStatuses.has(a.status) ? as.localeCompare(bs) : bs.localeCompare(as);
            });

            container.innerHTML = orders.map(order => {
                const items = (order.items || [])
                    .map(item => `${esc(item.icon || '🍽️')} ${esc(item.name)}`)
                    .join(' · ');
                const slot = order.slot
                    ? `${order.slot.dateLabel} ${order.slot.label} · ${order.slot.time}`
                    : '旧订单（无预约时间）';
                const extra = [];
                if (order.lastNudgeAt) extra.push('用户催过单');
                if (order.thanks) extra.push(`用户说：${esc(order.thanks.note)}`);
                if (order.cancelled && order.cancelled.reason) extra.push(`取消原因：${esc(order.cancelled.reason)}`);

                const actions = [];
                if (order.status === 'pending') {
                    actions.push(`<button class="admin-action primary" type="button" data-admin-next="${esc(order.id)}" data-next-status="accepted">接单</button>`);
                    actions.push(`<button class="admin-action danger" type="button" data-admin-cancel="${esc(order.id)}">拒单退款</button>`);
                } else if (order.status === 'accepted') {
                    actions.push(`<button class="admin-action primary" type="button" data-admin-next="${esc(order.id)}" data-next-status="prepping">开始备菜</button>`);
                    actions.push(`<button class="admin-action danger" type="button" data-admin-cancel="${esc(order.id)}">取消退款</button>`);
                } else if (order.status === 'prepping') {
                    actions.push(`<button class="admin-action primary" type="button" data-admin-next="${esc(order.id)}" data-next-status="cooking">开始制作</button>`);
                    actions.push(`<button class="admin-action danger" type="button" data-admin-cancel="${esc(order.id)}">取消退款</button>`);
                } else if (order.status === 'cooking') {
                    actions.push(`<button class="admin-action primary" type="button" data-admin-next="${esc(order.id)}" data-next-status="served">出餐啦</button>`);
                    actions.push(`<button class="admin-action danger" type="button" data-admin-cancel="${esc(order.id)}">取消退款</button>`);
                } else if (order.status === 'served') {
                    actions.push(`<button class="admin-action primary" type="button" data-admin-next="${esc(order.id)}" data-next-status="completed">完成</button>`);
                }

                return `
                    <article class="admin-order status-${order.status}">
                        <div class="admin-order-top">
                            <div>
                                <b>${esc(order.id)}</b>
                                <span class="order-badge">${ORDER_LABEL[order.status] || order.status}</span>
                            </div>
                            <span class="admin-order-time">${clock(order.placedAt)}</span>
                        </div>
                        <p class="admin-order-slot">预约 ${esc(slot)}</p>
                        <p class="admin-order-items">${items || '—'}</p>
                        <div class="admin-order-meta">
                            <span>合计 ${order.total} 币</span>
                            <span>${order.itemCount || (order.items || []).length} 道菜</span>
                            <span>约 ${order.etaMinutes || 0} 分钟</span>
                            <span>${formatDate(order.placedAt)}</span>
                        </div>
                        ${order.note ? `<p class="admin-order-note">“${esc(order.note)}”</p>` : ''}
                        ${extra.length ? `<p class="admin-order-extra">${extra.join(' · ')}</p>` : ''}
                        ${actions.length ? `<div class="admin-order-actions">${actions.join('')}</div>` : ''}
                    </article>
                `;
            }).join('');
        }

        async function handleOrderListClick(event) {
            const nextButton = event.target.closest('[data-admin-next]');
            if (nextButton) {
                const id = nextButton.dataset.adminNext;
                const status = nextButton.dataset.nextStatus;
                nextButton.disabled = true;
                try {
                    await setOrderStatus(id, status, { by: 'admin' });
                    showMessage(`订单 ${id} 已更新为「${ORDER_LABEL[status]}」`, 'success');
                    await refreshAdminOrders();
                } catch (error) {
                    showMessage(error.message, 'error');
                    nextButton.disabled = false;
                }
                return;
            }

            const cancelButton = event.target.closest('[data-admin-cancel]');
            if (cancelButton) {
                const id = cancelButton.dataset.adminCancel;
                const ok = await adminConfirm({
                    title: '取消这一单？',
                    message: `订单 ${id} 会取消，恋爱币全额退回。`,
                    okText: '取消并退款',
                    danger: true
                });
                if (!ok) return;
                cancelButton.disabled = true;
                try {
                    await cancelOrder(id, { by: 'admin', reason: '' });
                    showMessage(`订单 ${id} 已取消，恋爱币已退回`, 'success');
                    await refreshAdminOrders();
                } catch (error) {
                    showMessage(error.message, 'error');
                    cancelButton.disabled = false;
                }
            }
        }

        /* ---------- kitchen: wallet ---------- */

        function renderWallet() {
            if (!adminData) return;
            const wallet = adminData.wallet || { balance: 0, overdraftLimit: 0, entries: [] };

            document.getElementById('admin-wallet-balance').textContent = wallet.balance;
            document.getElementById('admin-summary-balance').textContent = wallet.balance;

            const limitInput = document.getElementById('admin-overdraft');
            if (limitInput && document.activeElement !== limitInput) {
                limitInput.value = wallet.overdraftLimit;
            }

            const container = document.getElementById('admin-wallet-entries');
            const entries = (wallet.entries || []).slice(0, 8);
            const labels = { grant: '发币', order: '点餐', refund: '退款' };

            container.innerHTML = entries.length ? entries.map(entry => `
                <div class="wallet-entry">
                    <span class="wallet-entry-main">
                        <b>${esc(entry.note || labels[entry.type] || '变动')}</b>
                        <small>${labels[entry.type] || '变动'} · ${formatDate(entry.createdAt)} · 余额 ${entry.balanceAfter}</small>
                    </span>
                    <span class="wallet-entry-amount ${Number(entry.amount) >= 0 ? 'is-plus' : 'is-minus'}">${Number(entry.amount) >= 0 ? '+' : ''}${entry.amount}</span>
                </div>
            `).join('') : '<div class="wallet-empty">还没有流水</div>';
        }

        async function handleGrant() {
            const amount = Number(document.getElementById('admin-grant-amount').value);
            const note = document.getElementById('admin-grant-note').value;
            if (!amount || amount <= 0) {
                showMessage('请输入大于 0 的币数', 'error');
                return;
            }

            const button = document.getElementById('admin-grant-btn');
            button.disabled = true;
            try {
                const wallet = await grantCoins(amount, note);
                adminData.wallet = wallet;
                document.getElementById('admin-grant-amount').value = '';
                document.getElementById('admin-grant-note').value = '';
                renderSummary();
                renderWallet();
                showMessage(`已发 ${amount} 恋爱币`, 'success');
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function handleSaveOverdraft() {
            const limit = Number(document.getElementById('admin-overdraft').value);
            try {
                const wallet = await setOverdraftLimit(limit);
                adminData.wallet = wallet;
                renderWallet();
                showMessage('超额上限已更新', 'success');
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        /* ---------- kitchen: menu ---------- */

        function categoryName(menu, id) {
            const category = (menu.categories || []).find(item => String(item.id) === String(id));
            return category ? category.name : '未分类';
        }

        function renderMenuAdmin() {
            if (!adminData) return;
            const menu = adminData.menu || { categories: [], dishes: [] };

            document.getElementById('admin-menu-count').textContent = `${menu.dishes.length} 道菜`;

            const select = document.getElementById('dish-category');
            const current = select.value;
            select.innerHTML = (menu.categories || [])
                .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0))
                .map(category => `<option value="${esc(category.id)}">${esc(category.icon || '')} ${esc(category.name)}</option>`)
                .join('');
            if (current && (menu.categories || []).some(category => String(category.id) === String(current))) {
                select.value = current;
            }

            const container = document.getElementById('admin-dish-list');
            if (!menu.dishes.length) {
                container.innerHTML = '<div class="empty-list">还没有菜品</div>';
                return;
            }

            const dishes = menu.dishes.slice().sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
            container.innerHTML = dishes.map(dish => `
                <div class="admin-dish" data-dish-id="${esc(dish.id)}">
                    <span class="admin-dish-icon" aria-hidden="true">${dish.image ? `<img src="${esc(dish.image)}" alt="">` : esc(dish.icon || '🍽️')}</span>
                    <span class="admin-dish-main">
                        <b>${esc(dish.name)}</b>
                        <small>${esc(categoryName(menu, dish.categoryId))} · ${dish.price} 币 · ${dish.prepMinutes} 分钟${dish.todaySpecial ? ' · 今日推荐' : ''}</small>
                    </span>
                    <span class="admin-dish-actions">
                        <button class="mini-btn ${dish.available ? 'is-on' : ''}" type="button" data-admin-dish-toggle="available">${dish.available ? '供应中' : '已下架'}</button>
                        <button class="mini-btn ${dish.todaySpecial ? 'is-on' : ''}" type="button" data-admin-dish-toggle="todaySpecial">推荐</button>
                        <button class="mini-btn" type="button" data-admin-dish-edit>编辑</button>
                        <button class="mini-btn danger" type="button" data-admin-dish-delete>删除</button>
                    </span>
                </div>
            `).join('');
        }

        async function handleDishListClick(event) {
            const row = event.target.closest('[data-dish-id]');
            if (!row || !adminData) return;
            const id = row.dataset.dishId;
            const dish = (adminData.menu.dishes || []).find(item => String(item.id) === String(id));
            if (!dish) return;

            if (event.target.closest('[data-admin-dish-edit]')) {
                fillDishForm(dish);
                return;
            }

            if (event.target.closest('[data-admin-dish-delete]')) {
                const ok = await adminConfirm({
                    title: '删除这道菜？',
                    message: `「${dish.name}」会从菜单里移除。`,
                    okText: '删除',
                    danger: true
                });
                if (!ok) return;
                try {
                    await deleteDish(id);
                    showMessage('菜品已删除', 'success');
                    await loadAdmin();
                    resetDishForm();
                } catch (error) {
                    showMessage(error.message, 'error');
                }
                return;
            }

            const toggle = event.target.closest('[data-admin-dish-toggle]');
            if (toggle) {
                try {
                    await toggleDish(id, toggle.dataset.adminDishToggle);
                    await loadAdmin();
                } catch (error) {
                    showMessage(error.message, 'error');
                }
            }
        }

        function fillDishForm(dish) {
            document.getElementById('dish-id').value = dish.id;
            document.getElementById('dish-name').value = dish.name || '';
            document.getElementById('dish-category').value = dish.categoryId || '';
            document.getElementById('dish-price').value = dish.price || '';
            document.getElementById('dish-prep').value = dish.prepMinutes || '';
            document.getElementById('dish-icon').value = dish.icon || '🍽️';
            document.getElementById('dish-tags').value = (dish.tags || []).join('，');
            document.getElementById('dish-image').value = dish.image || '';
            document.getElementById('dish-desc').value = dish.description || '';
            document.getElementById('dish-available').checked = dish.available !== false;
            document.getElementById('dish-special').checked = !!dish.todaySpecial;
            document.getElementById('dish-form-title').textContent = '编辑菜品';
            document.getElementById('dish-submit').textContent = '保存修改';
            document.getElementById('dish-cancel').hidden = false;
            document.getElementById('dish-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetDishForm() {
            document.getElementById('dish-id').value = '';
            document.getElementById('dish-name').value = '';
            document.getElementById('dish-price').value = '';
            document.getElementById('dish-prep').value = '';
            document.getElementById('dish-icon').value = '🍽️';
            document.getElementById('dish-tags').value = '';
            document.getElementById('dish-image').value = '';
            document.getElementById('dish-desc').value = '';
            document.getElementById('dish-available').checked = true;
            document.getElementById('dish-special').checked = false;
            document.getElementById('dish-form-title').textContent = '添加菜品';
            document.getElementById('dish-submit').textContent = '保存菜品';
            document.getElementById('dish-cancel').hidden = true;
        }

        async function handleDishSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('dish-id').value;
            const dish = {
                id: id || undefined,
                name: document.getElementById('dish-name').value,
                categoryId: document.getElementById('dish-category').value,
                price: Number(document.getElementById('dish-price').value),
                prepMinutes: Number(document.getElementById('dish-prep').value),
                icon: document.getElementById('dish-icon').value || '🍽️',
                tags: document.getElementById('dish-tags').value,
                image: document.getElementById('dish-image').value,
                description: document.getElementById('dish-desc').value,
                available: document.getElementById('dish-available').checked,
                todaySpecial: document.getElementById('dish-special').checked
            };

            const button = document.getElementById('dish-submit');
            button.disabled = true;
            try {
                await upsertDish(dish);
                showMessage(id ? '菜品已更新' : '菜品已添加', 'success');
                await loadAdmin();
                resetDishForm();
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                button.disabled = false;
            }
        }

        /* ---------- message ---------- */

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;

            setTimeout(() => {
                messageEl.className = 'message';
            }, 3000);
        }
    </script>
</body>
</html>
