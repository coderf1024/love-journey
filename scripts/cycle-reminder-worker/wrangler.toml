# 生理期每日提醒
# 部署：npx wrangler deploy --config scripts/cycle-reminder-worker/wrangler.toml
# 也可直接在 Cloudflare 控制台粘贴 worker.js（见 README.md）

name = "love-journey-cycle-reminder"
main = "worker.js"
compatibility_date = "2026-11-01"

# 每天 01:00 UTC = 北京时间 09:00
[triggers]
crons = ["0 1 * * *"]

# 查询用（dry run）：/run?dry=1&today=2026-12-08
[observability]
enabled = true
