<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱卡核销</title>
    <link rel="stylesheet" href="css/style.css?v=20261026-01">
    <style>
        .use-container {
            width: min(500px, calc(100% - 28px));
            margin: 0 auto;
            padding: 28px 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .use-card {
            background: linear-gradient(135deg, rgba(255, 253, 246, 0.96), rgba(255, 248, 235, 0.9));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: clamp(28px, 7vw, 42px);
            box-shadow: var(--shadow);
            text-align: center;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .use-card::before {
            content: '';
            position: absolute;
            inset: 14px;
            border: 1px dashed rgba(201, 69, 56, 0.24);
            pointer-events: none;
        }

        .use-icon {
            position: relative;
            width: 82px;
            height: 82px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            font-size: 3rem;
            background: linear-gradient(135deg, rgba(255, 215, 223, 0.5), rgba(248, 220, 136, 0.36));
            border: 1px solid rgba(239, 122, 149, 0.24);
            border-radius: 999px;
        }

        .use-icon-coupon::before {
            width: 38px;
            height: 28px;
            background: var(--lemon);
            border: 2px solid var(--stamp);
            border-radius: 8px;
            box-shadow: inset 0 -7px 0 rgba(239, 122, 149, 0.18);
        }

        .use-icon-coupon::after {
            width: 17px;
            height: 17px;
            background: var(--route);
            border-radius: 999px;
        }

        .use-icon-done::before {
            width: 42px;
            height: 42px;
            background: var(--route);
            border-radius: 999px;
        }

        .use-icon-done::after {
            width: 20px;
            height: 11px;
            border-left: 5px solid var(--paper-soft);
            border-bottom: 5px solid var(--paper-soft);
            transform: rotate(-45deg) translate(1px, -2px);
        }

        .use-title {
            color: var(--ink);
            font-family: var(--font-cute);
            font-size: 1.45rem;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .use-duration {
            margin-bottom: 28px;
            color: var(--stamp);
            font-family: var(--font-ui);
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            font-weight: 800;
            line-height: 1;
        }

        .use-info {
            margin-bottom: 28px;
            padding: 14px 18px;
            background: rgba(251, 242, 223, 0.72);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .use-info-item {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            padding: 11px 0;
            border-bottom: 1px dashed rgba(38, 34, 58, 0.18);
        }

        .use-info-item:last-child {
            border-bottom: none;
        }

        .use-info-label {
            color: var(--muted);
        }

        .use-info-value {
            color: var(--ink);
            font-family: Inter, sans-serif;
            font-weight: 700;
            text-align: right;
        }

        .use-btn {
            width: 100%;
            min-height: 54px;
            padding: 0 18px;
            background: linear-gradient(135deg, var(--stamp), #f39caf);
            border: none;
            border-radius: 999px;
            color: var(--paper-soft);
            font-family: var(--font-soft);
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .use-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e96f8b, var(--route));
        }

        .use-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .use-btn.success {
            background: var(--route);
        }

        .status-badge {
            display: inline-block;
            margin-bottom: 18px;
            padding: 5px 13px;
            border-radius: 999px;
            font-family: var(--font-ui);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .status-badge.available {
            background: rgba(91, 184, 182, 0.14);
            color: var(--route);
        }

        .status-badge.used {
            background: rgba(38, 34, 58, 0.1);
            color: var(--muted);
        }

        .error-card {
            text-align: center;
        }

        .error-icon {
            position: relative;
            font-size: 4rem;
            margin-bottom: 20px;
            width: 82px;
            height: 82px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(239, 122, 149, 0.14);
            border-radius: 999px;
        }

        .error-icon-flat::before,
        .error-icon-flat::after {
            top: 38px;
            left: 23px;
            width: 36px;
            height: 6px;
            background: var(--stamp);
            border-radius: 999px;
        }

        .error-icon-flat::before {
            transform: rotate(45deg);
        }

        .error-icon-flat::after {
            transform: rotate(-45deg);
        }

        .error-title {
            font-size: 1.5rem;
            font-family: var(--font-cute);
            color: var(--ink);
            margin-bottom: 10px;
        }

        .error-message {
            color: var(--muted);
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            padding: 12px 26px;
            background: var(--ink);
            border-radius: 999px;
            color: var(--paper-soft);
            text-decoration: none;
            font-weight: 800;
            transition: transform 0.3s ease;
        }

        .back-link:hover {
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(38, 34, 58, 0.12);
            border-top-color: var(--stamp);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="use-container">
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p style="color: var(--muted);">加载中...</p>
        </div>

        <div id="use-card" class="use-card" style="display: none;">
            <div class="use-icon use-icon-coupon" aria-hidden="true"></div>
            <span class="status-badge available" id="status-badge">未使用</span>
            <h1 class="use-title" id="coupon-title">恋爱卡</h1>
            <div class="use-duration" id="coupon-duration">10分钟</div>
            
            <div class="use-info">
                <div class="use-info-item">
                    <span class="use-info-label">编号</span>
                    <span class="use-info-value" id="coupon-id">-</span>
                </div>
                <div class="use-info-item">
                    <span class="use-info-label">获取时间</span>
                    <span class="use-info-value" id="coupon-acquired">-</span>
                </div>
            </div>

            <button class="use-btn" id="use-btn">确认使用</button>
        </div>

        <div id="used-card" class="use-card" style="display: none;">
            <div class="use-icon use-icon-done" aria-hidden="true"></div>
            <h1 class="use-title">已使用</h1>
            <div class="use-duration" id="used-duration">10分钟</div>
            <div class="use-info">
                <div class="use-info-item">
                    <span class="use-info-label">使用时间</span>
                    <span class="use-info-value" id="used-date">-</span>
                </div>
            </div>
            <!-- <a href="index.html" class="back-link">返回首页</a> -->
        </div>

        <div id="error-card" class="use-card error-card" style="display: none;">
            <div class="error-icon error-icon-flat" aria-hidden="true"></div>
            <h1 class="error-title">出错了</h1>
            <p class="error-message" id="error-message">无效的按摩券</p>
            <!-- <a href="index.html" class="back-link">返回首页</a> -->
        </div>
    </div>

    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
    <script src="js/oss-config.js?v=20261026-01"></script>
    <script src="js/crypto-utils.js?v=20261026-01"></script>
    <script src="js/oss-utils.js?v=20261026-01"></script>
    <script src="js/store.js?v=20261026-01"></script>
    <script>
        let currentCouponId = null;

        document.getElementById('use-btn').addEventListener('click', handleUse);

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const couponId = parseInt(urlParams.get('id'));
            
            if (!couponId) {
                showError('无效的链接');
                return;
            }

            currentCouponId = couponId;

            if (typeof getCoupon !== 'function') {
                showError('页面脚本版本不一致，请强制刷新一下');
                return;
            }

            try {
                const coupon = await getCoupon(couponId);

                if (!coupon) {
                    showError('无效的恋爱卡');
                    return;
                }

                document.getElementById('loading').style.display = 'none';

                if (coupon.status === 'used') {
                    showUsed(coupon);
                } else {
                    showCoupon(coupon);
                }
            } catch (error) {
                showError('加载失败: ' + error.message);
            }
        }

        function showCoupon(coupon) {
            document.getElementById('use-card').style.display = 'block';
            document.getElementById('coupon-title').textContent = coupon.title;
            document.getElementById('coupon-duration').textContent = coupon.duration + coupon.durationUnit;
            document.getElementById('coupon-id').textContent = '#' + coupon.id;
            document.getElementById('coupon-acquired').textContent = formatDate(coupon.acquiredDate);
        }

        function showUsed(coupon) {
            document.getElementById('used-card').style.display = 'block';
            document.getElementById('used-duration').textContent = coupon.duration + coupon.durationUnit;
            document.getElementById('used-date').textContent = formatDate(coupon.usedDate);
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-card').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }

        async function handleUse() {
            const useBtn = document.getElementById('use-btn');
            useBtn.disabled = true;
            useBtn.textContent = '核销中...';

            try {
                const coupon = await useCoupon(currentCouponId);

                document.getElementById('use-card').style.display = 'none';
                showUsed(coupon);
            } catch (error) {
                useBtn.disabled = false;
                useBtn.textContent = '确认使用';
                document.getElementById('use-card').style.display = 'none';
                showError('核销失败: ' + error.message);
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const text = String(dateString);
            const date = new Date(text.includes('T') ? text : text.replace(/-/g, '/'));
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        init();
    </script>
</body>
</html>
